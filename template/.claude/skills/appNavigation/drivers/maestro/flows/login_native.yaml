# Login through the app's own screen (native fields). Skipped by navigate when the app is
# already past the login (READY_SEL visible). Same env as login_web_form.yaml.
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: "${LOGIN_BUTTON != '' ? LOGIN_BUTTON + '|' : ''}${USERNAME_SEL}|${READY_SEL}"
    timeout: 60000

- runFlow:
    when:
      notVisible:
        id: "${READY_SEL}"
    commands:
      - runFlow:
          when:
            true: ${LOGIN_BUTTON != ''}
            visible:
              id: "${LOGIN_BUTTON}"
          commands:
            - tapOn:
                id: "${LOGIN_BUTTON}"
            - extendedWaitUntil:
                visible:
                  id: "${USERNAME_SEL}"
                timeout: 30000
      - tapOn:
          id: "${USERNAME_SEL}"
      - eraseText: 100
      - inputText: ${USERNAME}
      - tapOn:
          id: "${PASSWORD_SEL}"
      - eraseText: 100
      - inputText: ${PASSWORD}
      - hideKeyboard
      - runFlow:
          when:
            true: ${SUBMIT_SEL == ''}
          commands:
            - pressKey: Enter
      - runFlow:
          when:
            true: ${SUBMIT_SEL != ''}
          commands:
            - tapOn:
                id: "${SUBMIT_SEL}"
      - extendedWaitUntil:
          visible:
            id: "${READY_SEL}"
          timeout: 60000
