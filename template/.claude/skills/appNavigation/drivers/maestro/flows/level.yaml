# One navigation level: optionally type QUERY into the level's search field, then scroll to
# the row whose text contains QUERY and tap it, then wait for the next screen.
#
# Env (set per level by the driver from app.json + the spec):
#   APP_ID
#   SEARCH_SEL   id of the search field ("" → no search, scroll only)
#   ROW_SEL      id of a list row (the same id on every row; the text sits on its children)
#   READY_SEL    id visible once the row's screen is open
#   QUERY        the text to search for and to match in the row
#   QUERY_RX     the same, regex-escaped (Maestro treats `text:` as a regex)
appId: ${APP_ID}
---
- runFlow:
    when:
      true: ${SEARCH_SEL != ''}
    commands:
      - tapOn:
          id: "${SEARCH_SEL}"
      - eraseText: 100
      - inputText: ${QUERY}
      - hideKeyboard

- scrollUntilVisible:
    element:
      id: "${ROW_SEL}"
      containsDescendants:
        - text: ".*${QUERY_RX}.*"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    id: "${ROW_SEL}"
    containsDescendants:
      - text: ".*${QUERY_RX}.*"
    index: 0

- extendedWaitUntil:
    visible:
      id: "${READY_SEL}"
    timeout: 15000
